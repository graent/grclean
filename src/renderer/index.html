<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- 窗口标题：主进程 BrowserWindow 的 title 会在页面加载后被这里的 title 覆盖。
         窗口卡顿「未响应」时 Windows DWM 画的 ghost 外框标题就取自窗口标题，
         留 Electron 会露出「Electron」字样，必须写成产品名。 -->
    <title>GrClean</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <style>
      /* ===== 启动页（splash）=====
         Vue 挂载前的窗口内容：logo + 名称 + slogan。
         全部内联，不依赖任何外部资源，窗口一显示就能画出来。
         背景色与主窗口 backgroundColor 一致（#f4f6f8），避免闪色差。 */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f4f6f8;
        user-select: none;
        transition: opacity 0.35s ease;
      }
      #splash.hide {
        opacity: 0;
        pointer-events: none;
      }
      #splash img {
        width: 92px;
        height: 92px;
        border-radius: 22px;
        box-shadow: 0 10px 28px rgba(124, 58, 237, 0.28);
      }
      #splash .name {
        margin-top: 6px;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.5px;
        color: #3a3f47;
        font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      #splash .slogan {
        font-size: 13px;
        color: #8a919c;
        letter-spacing: 1px;
        font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      #splash .bar {
        margin-top: 18px;
        width: 132px;
        height: 3px;
        border-radius: 2px;
        overflow: hidden;
        background: rgba(124, 58, 237, 0.15);
      }
      #splash .bar i {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 2px;
        background: linear-gradient(90deg, #8b5cf6, #6d3ee0);
        animation: splash-bar 1.1s ease-in-out infinite;
      }
      @keyframes splash-bar {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(340%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash {
          transition: none;
        }
        #splash .bar i {
          animation: none;
        }
      }
    </style>
  </head>
